name: Ping Apple Pickup Watch

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch private watcher
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/PavloHarmash1/pharm/actions/workflows/apple-pickup-watch.yml/dispatches \
            -d '{"ref":"main"}'
